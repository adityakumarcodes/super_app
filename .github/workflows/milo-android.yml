name: 🛠 Android CI / Build & Release APK + AAB

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions:  read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_DIRECTORY: milo

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: milo

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('milo/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: 🧹 Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 🔍 Analyze
        run: flutter analyze

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: 🏗️ Build split APKs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: 📦 Build Android App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts

          cp build/app/outputs/flutter-apk/*.apk artifacts/
          cp build/app/outputs/bundle/release/*.aab artifacts/

          ls -lh artifacts/

      - name: ⬆️ Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: milo-android-apks
          path: milo/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: ⬆️ Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: milo-android-aab
          path: milo/artifacts/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: 🏷️ Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Milo ${{ github.ref_name }}
          artifacts: milo/artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true